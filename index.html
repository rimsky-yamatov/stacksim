
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack Machine</title>
<style>
*{box-sizing:border-box}
:root{font-family:Arial,Helvetica,sans-serif;color:#202020;background:#f5f5f2}
body{margin:0}
header{padding:20px 24px;border-bottom:1px solid #d5d5d0;background:#fff}
h1{font-size:22px;font-weight:600;margin:0}
header p{font-size:13px;color:#666;margin:5px 0 0}
main{max-width:1080px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
section{background:#fff;border:1px solid #d8d8d2;padding:18px}
h2{font-size:16px;font-weight:600;margin:0 0 14px}
label{font-size:13px;color:#444;display:block;margin-bottom:5px}
textarea,input{font:14px/1.5 Consolas,"Courier New",monospace;border:1px solid #c9c9c3;background:#fff;color:#202020;padding:9px;width:100%;border-radius:2px}
textarea{min-height:240px;resize:vertical;tab-size:2}
button{font:13px Arial,Helvetica,sans-serif;border:1px solid #bcbcb5;background:#f4f4f1;color:#222;padding:8px 12px;border-radius:2px;cursor:pointer}
button:hover{background:#e9e9e4}
button:active{background:#ddd}
button.main{background:#303030;border-color:#303030;color:#fff}
button.main:hover{background:#111}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.small{font-size:12px;color:#666;line-height:1.55}
.stack{border:1px solid #d8d8d2;min-height:220px;padding:10px;display:flex;flex-direction:column-reverse;align-items:stretch;gap:5px}
.cell{border:1px solid #bfc9d6;background:#edf2f7;padding:9px 12px;font:15px Consolas,"Courier New",monospace;overflow-wrap:anywhere}
.cell.top{border-color:#5a7190;background:#dce6f1}
.empty{color:#777;text-align:center;margin:auto;font-size:13px}
.meta{display:flex;justify-content:space-between;font-size:12px;color:#666;margin:8px 0 15px}
.status{font-size:13px;min-height:36px;border-top:1px solid #e1e1dc;padding-top:10px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.status.error{color:#a22}
.log{font:12px/1.55 Consolas,"Courier New",monospace;background:#fafaf8;border:1px solid #deded8;padding:8px;height:125px;overflow:auto;white-space:pre-wrap}
.commands{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.commands button{font-family:Consolas,"Courier New",monospace}
hr{border:0;border-top:1px solid #e0e0da;margin:16px 0}
@media(max-width:720px){
  main{grid-template-columns:1fr;margin:14px auto}
  header{padding:16px 18px}
  textarea{min-height:180px}
}
</style>
</head>
<body>
<header>
  <h1>Stack Machine</h1>
  <p>スタック操作・命令列実行ツール</p>
</header>

<main>
<section>
  <h2>プログラム</h2>
  <label for="source">命令を1行ずつ記述</label>
  <textarea id="source" spellcheck="false">push 10
push 20
dup
add
push 5
swap
sub</textarea>

  <div class="controls">
    <button class="main" id="run">最初から実行</button>
    <button id="step">1命令実行</button>
    <button id="reset">リセット</button>
  </div>

  <p class="small">
    値を積む場合は <code>push 値</code> と明示してください。
    空行と # から始まるコメント行は無視されます。
  </p>

  <hr>
  <h2>命令一覧</h2>
  <div class="commands">
    <button data-op="push">push 値</button>
    <button data-op="pop">pop</button>
    <button data-op="dup">dup</button>
    <button data-op="swap">swap</button>
    <button data-op="over">over</button>
    <button data-op="rot">rot</button>
    <button data-op="add">add</button>
    <button data-op="sub">sub</button>
    <button data-op="mul">mul</button>
    <button data-op="div">div</button>
    <button data-op="mod">mod</button>
    <button data-op="neg">neg</button>
    <button data-op="clear">clear</button>
  </div>
  <p class="small">
    ボタンを押すと、カーソル位置に命令を挿入します。
    push は push 0 として挿入されます。
  </p>
</section>

<section>
  <h2>スタック</h2>
  <div class="stack" id="stack">
    <div class="empty">スタックは空です</div>
  </div>
  <div class="meta">
    <span id="depth">深さ: 0</span>
    <span id="position">命令: 0 / 0</span>
  </div>
  <div class="status" id="status">実行待ち</div>

  <hr>
  <h2>実行ログ</h2>
  <div class="log" id="log">実行ログはここに表示されます。</div>

  <hr>
  <h2>スタックへの直接操作</h2>
  <label for="directValue">push する値</label>
  <input id="directValue" value="42" spellcheck="false">
  <div class="controls">
    <button class="main" id="directPush">push</button>
    <button id="directPop">pop</button>
    <button id="directDup">dup</button>
    <button id="directSwap">swap</button>
    <button id="directClear">clear</button>
  </div>
  <p class="small">直接操作は現在のスタックに反映されます。</p>
</section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  let stack = [];
  let instructions = [];
  let pc = 0;
  let logs = [];

  function showStatus(message, error = false) {
    $('status').textContent = message;
    $('status').className = 'status' + (error ? ' error' : '');
  }

  function addLog(message) {
    logs.unshift(message);
    logs = logs.slice(0, 80);
    $('log').textContent = logs.join('\n');
  }

  function render() {
    const root = $('stack');
    root.replaceChildren();

    if (!stack.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'スタックは空です';
      root.append(empty);
    } else {
      stack.forEach((value, index) => {
        const cell = document.createElement('div');
        cell.className = 'cell' +
          (index === stack.length - 1 ? ' top' : '');
        cell.textContent = String(value) +
          (index === stack.length - 1 ? '   ← TOP' : '');
        root.append(cell);
      });
    }

    $('depth').textContent = '深さ: ' + stack.length;
    $('position').textContent =
      `命令: ${pc} / ${instructions.length}`;
  }

  function parseValue(text) {
    const s = text.trim();

    if (!s) {
      throw new Error('push: 値が指定されていません');
    }

    if (/^-?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(s)) {
      const n = Number(s);
      if (!Number.isFinite(n)) {
        throw new Error('有限の数値を指定してください');
      }
      return n;
    }

    if (
      (s[0] === '"' && s.at(-1) === '"') ||
      (s[0] === "'" && s.at(-1) === "'")
    ) {
      return s.slice(1, -1)
        .replace(/\\n/g, '\n')
        .replace(/\\t/g, '\t')
        .replace(/\\(["'\\])/g, '$1');
    }

    return s;
  }

  function need(n, op) {
    if (stack.length < n) {
      throw new Error(
        `${op}: スタックに ${n} 個以上の値が必要です`
      );
    }
  }

  function execute(op, arg) {
    const name = op.toLowerCase();
    const before = stack.slice();

    switch (name) {
      case 'push':
        stack.push(parseValue(arg ?? ''));
        break;

      case 'pop':
        need(1, name);
        stack.pop();
        break;

      case 'dup':
        need(1, name);
        stack.push(stack[stack.length - 1]);
        break;

      case 'swap': {
        need(2, name);
        const n = stack.length;
        [stack[n - 1], stack[n - 2]] =
          [stack[n - 2], stack[n - 1]];
        break;
      }

      case 'over':
        need(2, name);
        stack.push(stack[stack.length - 2]);
        break;

      case 'rot': {
        need(3, name);
        const n = stack.length;
        const a = stack.splice(n - 3, 1)[0];
        stack.push(a);
        break;
      }

      case 'neg':
        need(1, name);
        if (typeof stack.at(-1) !== 'number') {
          throw new Error('neg: TOP は数値である必要があります');
        }
        stack[stack.length - 1] *= -1;
        break;

      case 'add':
      case 'sub':
      case 'mul':
      case 'div':
      case 'mod': {
        need(2, name);

        const b = stack.at(-1);
        const a = stack[stack.length - 2];

        if (typeof a !== 'number' || typeof b !== 'number') {
          throw new Error(`${name}: 数値2個が必要です`);
        }

        if ((name === 'div' || name === 'mod') && b === 0) {
          throw new Error(`${name}: 0 は使用できません`);
        }

        let result;

        if (name === 'add') result = a + b;
        if (name === 'sub') result = a - b;
        if (name === 'mul') result = a * b;
        if (name === 'div') result = a / b;
        if (name === 'mod') result = a % b;

        if (!Number.isFinite(result)) {
          throw new Error('計算結果が有限の数値ではありません');
        }

        stack.splice(-2, 2);
        stack.push(result);
        break;
      }

      case 'clear':
        stack = [];
        break;

      default:
        throw new Error('不明な命令: ' + op);
    }

    render();

    const argText = arg === undefined ? '' : ' ' + arg;
    showStatus(`${name}${argText} を実行しました`);
    addLog(
      `${name}${argText}   [${before.join(', ')}] -> [${stack.join(', ')}]`
    );
  }

  function parseProgram() {
    return $('source').value
      .split(/\r?\n/)
      .map((line, i) => ({
        line: line.trim(),
        number: i + 1
      }))
      .filter(x => x.line && !x.line.startsWith('#'))
      .map(x => {
        const m = x.line.match(/^(\S+)(?:\s+(.+))?$/);
        return {
          op: m[1],
          arg: m[2],
          line: x.number,
          raw: x.line
        };
      });
  }

  function runStep() {
    if (pc >= instructions.length) {
      showStatus('プログラムの実行が完了しています');
      return false;
    }

    const ins = instructions[pc++];

    try {
      execute(ins.op, ins.arg);
      addLog(`行 ${ins.line}: ${ins.raw}`);
      render();
      return true;
    } catch (e) {
      showStatus(`行 ${ins.line}: ${e.message}`, true);
      addLog(`ERROR 行 ${ins.line}: ${e.message}`);
      render();
      return false;
    }
  }

  function startRun() {
    try {
      instructions = parseProgram();
      pc = 0;
      stack = [];
      logs = [];
      $('log').textContent = '';

      render();
      addLog('実行開始');

      while (pc < instructions.length) {
        if (!runStep()) break;
      }

      if (pc >= instructions.length) {
        showStatus('プログラムの実行が完了しました');
      }
    } catch (e) {
      showStatus(e.message, true);
    }
  }

  function prepareStep() {
    try {
      instructions = parseProgram();

      if (pc === 0 && logs.length === 0) {
        stack = [];
        render();
        addLog('ステップ実行開始');
      }

      runStep();
    } catch (e) {
      showStatus(e.message, true);
    }
  }

  $('run').addEventListener('click', startRun);
  $('step').addEventListener('click', prepareStep);

  $('reset').addEventListener('click', () => {
    stack = [];
    instructions = [];
    pc = 0;
    logs = [];
    $('log').textContent = '';
    render();
    showStatus('リセットしました');
  });

  $('directPush').addEventListener('click', () => {
    try {
      execute('push', $('directValue').value);
    } catch (e) {
      showStatus(e.message, true);
    }
  });

  $('directPop').addEventListener('click', () => {
    try {
      execute('pop');
    } catch (e) {
      showStatus(e.message, true);
    }
  });

  $('directDup').addEventListener('click', () => {
    try {
      execute('dup');
    } catch (e) {
      showStatus(e.message, true);
    }
  });

  $('directSwap').addEventListener('click', () => {
    try {
      execute('swap');
    } catch (e) {
      showStatus(e.message, true);
    }
  });

  $('directClear').addEventListener('click', () => {
    try {
      execute('clear');
    } catch (e) {
      showStatus(e.message, true);
    }
  });

  document.querySelectorAll('[data-op]').forEach(button => {
    button.addEventListener('click', () => {
      const op = button.dataset.op;
      const insert = op === 'push' ? 'push 0\n' : op + '\n';
      const area = $('source');
      const start = area.selectionStart;
      const end = area.selectionEnd;

      area.setRangeText(insert, start, end, 'end');
      area.focus();
    });
  });

  render();
})();
</script>
</body>
</html>
